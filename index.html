<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; direction: rtl; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; border-radius: 8px; }
        .categories { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .cat-btn { background: #fff; border: 1px solid #075e54; color: #075e54; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .cat-btn.active, .cat-btn:hover { background: #075e54; color: #fff; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card h3 { font-size: 16px; margin: 10px 0; }
        .product-card p { color: #888; font-size: 14px; }
        .product-card button { background: #25d366; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 5px; width: 100%; font-weight: bold; }
        .cart-section { background: white; margin-top: 30px; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .checkout-btn { background: #075e54; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; cursor: pointer; border-radius: 5px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>متجري الشامل</h1>
        <p>تسوق أفضل المنتجات بكل سهولة</p>
    </header>

    <!-- الأقسام -->
    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('all')">الكل</button>
        <button class="cat-btn" onclick="filterCategory('men')">ملابس رجالي</button>
        <button class="cat-btn" onclick="filterCategory('women')">ملابس نسائي</button>
        <button class="cat-btn" onclick="filterCategory('kids')">ملابس أطفال</button>
        <button class="cat-btn" onclick="filterCategory('phones')">مستلزمات تلفونات</button>
    </div>

    <!-- قائمة المنتجات -->
    <div class="products-grid" id="products-grid">
        <!-- المنتجات تظهر تلقائياً هنا عبر الجافاسكريبت -->
    </div>

    <!-- سلة التسوق -->
    <div class="cart-section">
        <h2>سلة التسوق</h2>
        <div id="cart-items">السلة فارغة حالياً</div>
        <h3>المجموع: <span id="total-price">0</span> ر.س</h3>
        <button class="checkout-btn" onclick="sendToWhatsApp()">إتمام الطلب عبر واتساب</button>
    </div>

    <script>
        // بيانات المنتجات والأقسام
        const products = [
            { id: 1, name: 'قميص رجالي أنيق', price: 120, category: 'men' },
            { id: 2, name: 'فستان نسائي راقي', price: 200, category: 'women' },
            { id: 3, name: 'طقم أطفال صيفي', price: 80, category: 'kids' },
            { id: 4, name: 'شاحن هاتف سريع', price: 50, category: 'phones' },
            { id: 5, name: 'سماعة بلوتوث لاسلكية', price: 150, category: 'phones' }
        ];

        let cart = [];

        function displayProducts(cat) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
            
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <h3>${p.name}</h3>
                        <p>${p.price} ر.س</p>
                        <button onclick="addToCart(${p.id})">إضافة للسلة</button>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayProducts(cat);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();+249110726106
        }

        function updateCart() {
            const container = document.getElementById('cart-items');
            const totalSpan = document.getElementById('total-price');
            if (cart.length === 0) {
                container.innerHTML = 'السلة فارغة حالياً';
                totalSpan.innerText = '0';
                return;
            }

            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `<div class="cart-item"><span>${item.name}</span> <span>${item.price} ر.س</span></div>`;
            });
            totalSpan.innerText = total;
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert('سلة التسوق فارغة!');
                return;
            }

            let message = 'السلام عليكم، أرغب في طلب المنتجات التالية:\n\n';
            let total = 0;
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.price} ر.س\n`;
                total += item.price;
            });
            message += `\nالمجموع الإجمالي: ${total} ر.س`;

            // ضع رقم الواتساب الخاص بك هنا بدل الرقم التجريبي (مع رمز الدولة بدون علامة +)
            const phoneNumber = '249110726106'; 
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // عرض كل المنتجات عند فتح الصفحة لأول مرة
        displayProducts('all');
    </script>
</body>
</html>
